name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default types (opened, synchronize, reopened) drive the normal `test`
    # and `security` jobs below, unchanged. `labeled` is added ONLY so the
    # `live-eval-pr` job (bottom of this file) can trigger when someone adds
    # the `eval-live` label — `test` and `security` explicitly skip labeled
    # events (see their `if:` conditions) so this does not make them re-run
    # on every label add/remove.
    types: [opened, synchronize, reopened, labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -e "." --no-deps

      - name: Lint (ruff)
        run: ruff check executionkit/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check executionkit/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy --strict executionkit/

      # Keep public exports, tracked pages, pattern surfaces, navigation, and
      # the architecture module map aligned with the source tree.
      - name: Doc-fact check
        run: python scripts/check_doc_facts.py

      # CI installs strictly from requirements.lock, so a package declared in
      # the dev extra but missing from the lock is never installed and any
      # test guarding on it skips silently while the job stays green. That is
      # how the Tier-B jsonschema validation tests went unrun between the lock
      # falling behind the dev extra and the audit that caught it.
      # See scripts/check_lock_parity.py.
      - name: Lock-parity check (dev extra vs requirements.lock)
        run: python scripts/check_lock_parity.py

      - name: Tests with coverage
        run: pytest tests/ --cov=executionkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q

      - name: Eval suite (deterministic goldens + failure corpus)
        run: pytest tests/test_eval_goldens.py tests/test_eval_failure_corpus.py tests/test_eval_metrics.py --no-cov -p no:cacheprovider -q

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # The enforced gate is pytest's --cov-fail-under=80 above. Codecov
          # upload stays advisory until the repository has a Codecov token.
          fail_ci_if_error: false

  security:
    name: "Security scan (Bandit)"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: bandit -r executionkit/ -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit --requirement requirements.lock

  observability:
    name: "Observability (OTel spans, [otel] extra)"
    # The `test` matrix deliberately installs only the locked dev extra, which
    # has no OpenTelemetry in it — that is what proves the library's zero-dep
    # no-op path works. The consequence is that the span-attribute assertions
    # in tests/test_observability.py have nowhere to run, so they skipped
    # everywhere until this job existed. This runs the same file against a real
    # OTel install, giving both configurations a home.
    #
    # Same trigger and `if:` guard as `test`/`security`, so it is required by
    # default on every push to main and every pull request — not label-gated.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Three installs, deliberately:
      #   1. the hashed lock, for pytest/pytest-asyncio (asyncio_mode = auto);
      #   2. the `[otel]` extra exactly as a user gets it, which resolves to
      #      opentelemetry-api only — that is all the library imports;
      #   3. opentelemetry-sdk, which the *tests* need to install an
      #      InMemorySpanExporter and read spans back. It is a test-only
      #      dependency: adding it to the `[otel]` extra would push an SDK onto
      #      library consumers, which is the opposite of the API-only
      #      convention OTel prescribes for libraries.
      # Steps 2 and 3 are unhashed, matching how the `security` job above
      # installs bandit and pip-audit.
      - name: Install dependencies (lock + [otel] extra + test-only SDK)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[otel]"
          pip install "opentelemetry-sdk>=1.20"

      # Without the SDK the span tests skipif-skip and this job would go green
      # having verified nothing — the exact failure mode it exists to fix.
      - name: Guard against a silent skip (SDK must be importable)
        run: python -c "import opentelemetry.sdk"

      # --no-cov: this is a single-file run and cannot meet the suite-wide
      # coverage gate that the `test` job enforces.
      - name: OTel span tests
        run: pytest tests/test_observability.py --no-cov -p no:cacheprovider -rs -q

  claude-sdk:
    name: "Claude Agent SDK transport ([claude] extra)"
    # executionkit/claude_sdk.py is the one transport that authenticates with a
    # Claude subscription sign-in instead of an API key, and it needs
    # claude-agent-sdk to do it. That package pulls `mcp`, which pulls
    # `opentelemetry-api` -- so putting it in the `dev` extra would put OTel
    # into the locked dev set and quietly destroy the property the `test` job
    # exists to prove (that the zero-dep no-op path works). It therefore stays
    # out of `dev`, tests/test_claude_sdk.py skips without it, and this job
    # gives that file the one environment where it actually runs.
    #
    # Same trigger and `if:` guard as `test`/`security`/`observability`, so it
    # is required by default on every push to main and every pull request.
    #
    # No CLI, sign-in, or network is needed: the tests monkeypatch
    # `executionkit.claude_sdk.query` and replay the SDK's own dataclasses.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Two installs: the hashed lock for pytest/pytest-asyncio, then the
      # `[claude]` extra exactly as a user gets it. The second is unhashed,
      # matching how `observability` installs its extra.
      - name: Install dependencies (lock + [claude] extra)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[claude]"

      # Without the SDK every test in the file skipif-skips and this job would
      # go green having verified nothing -- the exact failure mode it exists
      # to prevent.
      - name: Guard against a silent skip (SDK must be importable)
        run: python -c "import claude_agent_sdk"

      # --no-cov: single-file run, cannot meet the suite-wide coverage gate.
      - name: Claude Agent SDK transport tests
        run: pytest tests/test_claude_sdk.py --no-cov -p no:cacheprovider -rs -q

  live-eval-pr:
    name: "Live eval (pytest -m live, label-gated)"
    # Opt-in real-model evidence for LIVE_CORPUS (tests/test_eval_live_cases.py)
    # on demand from a pull request. Deliberately NOT part of the required
    # `test` job so a flaky/slow real-model call can never block a merge: it
    # only runs when the `eval-live` label is present on the PR (add the
    # label to trigger it; GitHub does not replay `labeled` events for jobs
    # added after a label was first applied, so re-add the label or re-run
    # the workflow manually if needed). Nightly real-endpoint coverage
    # already exists via .github/workflows/live-eval.yml's own schedule
    # trigger, which now also runs this same `pytest -m live` corpus — see
    # that file for the "Run LIVE_CORPUS" step.
    #
    # Requires EXECUTIONKIT_API_KEY (+ EXECUTIONKIT_BASE_URL/EXECUTIONKIT_MODEL)
    # configured as repository/environment secrets. The "Run LIVE_CORPUS" step
    # below only exports EXECUTIONKIT_LIVE_EVAL=1 when EXECUTIONKIT_BASE_URL is
    # actually non-empty at runtime (plain shell check, not a GitHub Actions
    # expression, so the behaviour is easy to verify locally). This matters
    # because live_provider_from_env() *raises* ValueError if LIVE_EVAL=1 is
    # set but BASE_URL/MODEL are blank — exporting it unconditionally would
    # turn a missing-secret repo into a hard CI failure instead of a clean
    # skip. With this guard: no secrets configured -> LIVE_EVAL stays unset ->
    # live_provider_from_env() returns None -> `pytest -m live` collects
    # LIVE_CORPUS and skips it -> job goes green without calling a real model.
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'eval-live'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -e "." --no-deps

      - name: Run LIVE_CORPUS (pytest -m live)
        env:
          EXECUTIONKIT_BASE_URL: ${{ secrets.EXECUTIONKIT_BASE_URL }}
          EXECUTIONKIT_MODEL: ${{ secrets.EXECUTIONKIT_MODEL }}
          EXECUTIONKIT_API_KEY: ${{ secrets.EXECUTIONKIT_API_KEY }}
        run: |
          # Only enable live evals when the endpoint secret is actually
          # configured; otherwise leave EXECUTIONKIT_LIVE_EVAL unset so
          # live_provider_from_env() returns None and pytest -m live
          # self-skips instead of raising ValueError for a blank BASE_URL.
          if [ -n "$EXECUTIONKIT_BASE_URL" ]; then
            export EXECUTIONKIT_LIVE_EVAL=1
          fi
          pytest -m live --no-cov -p no:cacheprovider -v
